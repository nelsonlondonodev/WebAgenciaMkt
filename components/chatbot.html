<!-- WhatsApp Widget: un toque abre el chat, sin tarjeta intermedia -->
<div id="chat-widget-container" class="fixed bottom-5 right-5 z-[9999] flex flex-col items-end">

  <!-- Soft Invitation Tooltip Bubble (Desplegable suave tras 6 seg) -->
  <div
    id="chat-invitation-bubble"
    class="sm:flex mb-3 mr-2 bg-white/95 dark:bg-gray-800/95 backdrop-blur-md border border-emerald-500/20 dark:border-emerald-500/30 shadow-2xl p-3.5 rounded-2xl text-sm font-medium text-gray-800 dark:text-white max-w-[250px] relative group items-center gap-3 cursor-pointer"
    style="display: none;"
  >
    <button
      id="close-chat-invitation"
      class="absolute -top-2 -left-2 w-6 h-6 bg-white dark:bg-gray-700 rounded-full shadow-md flex items-center justify-center text-gray-500 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity border border-gray-100 dark:border-gray-600"
      aria-label="Cerrar invitación"
    >
      <i class="fas fa-times text-[10px]" aria-hidden="true"></i>
    </button>

    <div class="w-9 h-9 rounded-xl bg-emerald-500/10 flex items-center justify-center flex-shrink-0 text-emerald-500 text-lg">
      <i class="fab fa-whatsapp" aria-hidden="true"></i>
    </div>

    <div class="text-xs leading-snug">
      <span class="font-bold text-gray-900 dark:text-white block mb-0.5">¡Hola! 👋</span>
      ¿Dudas sobre tu proyecto? Hablemos por WhatsApp 💬
    </div>

    <!-- Flecha hacia el botón -->
    <div class="absolute -bottom-2 right-6 w-4 h-4 bg-white/95 dark:bg-gray-800/95 border-r border-b border-emerald-500/20 dark:border-emerald-500/30 rotate-45"></div>
  </div>

  <!-- Botón Flotante Verde Oficial Limpio -->
  <a
    id="chat-widget-button"
    href="https://wa.me/34604547203?text=Hola%20Nelson%2C%20vengo%20de%20tu%20web%20y%20me%20gustar%C3%ADa%20recibir%20informaci%C3%B3n%20sobre%20tus%20servicios."
    target="_blank"
    rel="noopener noreferrer"
    class="bg-[#25D366] hover:bg-[#20bd5a] text-white rounded-full w-16 h-16 flex items-center justify-center shadow-[0_10px_30px_rgba(37,211,102,0.45)] hover:shadow-[0_12px_35px_rgba(37,211,102,0.65)] transition-all duration-300 hover:scale-110 active:scale-95 group relative cursor-pointer"
    aria-label="Escribir por WhatsApp a Nelson Londoño"
  >
    <i class="fab fa-whatsapp text-3xl group-hover:rotate-12 transition-transform duration-300" aria-hidden="true"></i>
    <!-- Active Status Indicator -->
    <span class="absolute top-0 right-0 w-4 h-4 bg-emerald-400 border-2 border-white dark:border-gray-900 rounded-full animate-ping"></span>
    <span class="absolute top-0 right-0 w-4 h-4 bg-emerald-400 border-2 border-white dark:border-gray-900 rounded-full"></span>
  </a>
</div>
